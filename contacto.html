<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diseño Multimedia | Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="encabezado">
    <div class="contenedor">
      <h1 class="logo">Diseño <span>Multimedia</span></h1>
      <nav class="menu">
        <ul>
          <li><a href="index.html">INICIO</a></li>
          <li><a href="nosotros.html">NOSOTROS</a></li>
          <li><a href="servicios.html">SERVICIOS</a></li>
          <li><a href="contacto.html" class="activo">CONTACTO</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="boletin">
    <div class="contenedor">
      <h3>Subscríbete a nuestro boletín</h3>
      <form class="form-boletin">
        <input type="email" placeholder="Ingrese el Email...">
        <button type="submit" class="boton-naranja">Suscribirse</button>
      </form>
    </div>
  </section>

  <main class="principal">
    <div class="contenedor-principal">
      <article class="columna-izquierda">
        <h3>Contacto</h3>
        <form class="form-contacto">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ingresa tu nombre">

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Ingresa tu email">

          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" placeholder="Ingresa tu teléfono">

          <label for="celular">Celular</label>
          <input type="text" id="celular" placeholder="Ingresa tu celular">

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje"></textarea>

          <button type="submit" class="boton-enviar">Enviar</button>
        </form>
      </article>

      <aside class="columna-derecha">
        <div class="caja-oscura">
          <h4>Que hacemos</h4>
          <p>
            vendemos,compramos
          </p>
        </div>

        <img src="img/mapa.png" alt="Ubicación" class="img-mapa">
      </aside>
    </div>
  </main>

  <footer class="footer">
    <p>Graphel Desarrollo Web, Copyright &copy; 2017</p>
  </footer>

</body>
</html>
